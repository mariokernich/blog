{{- /* Preload the two most-used Poppins subsets to avoid FOUT for body text */
-}}
<link
    rel="preload"
    href="/fonts/poppins/poppins-400-latin.woff2"
    as="font"
    type="font/woff2"
    crossorigin
/>
<link
    rel="preload"
    href="/fonts/poppins/poppins-600-latin.woff2"
    as="font"
    type="font/woff2"
    crossorigin
/>

{{- /* Scroll progress indicator for the sticky header */ -}}
<script src="/js/scroll-progress.js" defer></script>

{{- /* Mobile burger menu toggle */ -}}
<script src="/js/burger-menu.js" defer></script>
