{{- /*
  Renders the schema.org FAQPage JSON-LD for rich snippets.
  Retrieves FAQ items registered by the custom faq-item shortcodes via .Page.Store.
*/ -}}
{{- $items := .Page.Store.Get "faqItems" -}}
{{- if $items -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $item := $items -}}
    {{- if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.question | plainify | chomp }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $item.answer | plainify | chomp }}
      }
    }
    {{- end }}
  ]
}
</script>
{{- end -}}
