<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .eyebrow {
        font-family: '72', 'Inter', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #0a6ed1;
        letter-spacing: 3px;
      }
      .headline {
        font-family: '72', 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 76px;
        fill: #32363a;
      }
      .subline {
        font-family: '72', 'Inter', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 26px;
        fill: #6a6d70;
      }
      .label {
        font-family: '72', 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 28px;
      }
      .footer {
        font-family: '72', 'Inter', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #6a6d70;
        letter-spacing: 1px;
      }
    </style>

    <!-- SAP blue accent gradient -->
    <linearGradient id="sapBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a6ed1" />
      <stop offset="100%" stop-color="#0854a0" />
    </linearGradient>

    <!-- Soft shadow used on the accent bar / chips -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Quartz Light surface -->
  <rect width="1200" height="630" fill="#f7f7f7" />

  <!-- Top SAP-blue accent bar (Fiori signature) -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#sapBlue)" />

  <!-- Subtle side accent line on the left -->
  <rect x="0" y="6" width="6" height="624" fill="#0a6ed1" opacity="0.15" />

  <!-- ===== Content block ===== -->
  <g transform="translate(96, 0)">
    <!-- Eyebrow -->
    <text x="0" y="170" class="eyebrow">A DEVELOPER'S MIGRATION STORY</text>

    <!-- Headline -->
    <text x="0" y="265" class="headline">From WordPress</text>
    <text x="0" y="355" class="headline">
      to <tspan fill="#0a6ed1">Hugo</tspan>.
    </text>

    <!-- Subline -->
    <text x="0" y="415" class="subline">After 11 years — finally free of plugin hell.</text>

    <!-- Chip row -->
    <g transform="translate(0, 470)" filter="url(#softShadow)">
      <!-- Chip: Markdown -->
      <g>
        <rect x="0" y="0" width="150" height="44" rx="22" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.5" />
        <circle cx="22" cy="22" r="5" fill="#0a6ed1" />
        <text x="38" y="29" font-family="'72','Inter',sans-serif" font-weight="600" font-size="16" fill="#32363a">Markdown</text>
      </g>
      <!-- Chip: Static -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="110" height="44" rx="22" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.5" />
        <circle cx="22" cy="22" r="5" fill="#0a6ed1" />
        <text x="38" y="29" font-family="'72','Inter',sans-serif" font-weight="600" font-size="16" fill="#32363a">Static</text>
      </g>
      <!-- Chip: Git -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="90" height="44" rx="22" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.5" />
        <circle cx="22" cy="22" r="5" fill="#0a6ed1" />
        <text x="38" y="29" font-family="'72','Inter',sans-serif" font-weight="600" font-size="16" fill="#32363a">Git</text>
      </g>
      <!-- Chip: Blazing Fast -->
      <g transform="translate(395, 0)">
        <rect x="0" y="0" width="170" height="44" rx="22" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.5" />
        <circle cx="22" cy="22" r="5" fill="#107e3e" />
        <text x="38" y="29" font-family="'72','Inter',sans-serif" font-weight="600" font-size="16" fill="#32363a">Blazing Fast</text>
      </g>
    </g>
  </g>

  <!-- ===== Decorative right side: WP → Hugo ===== -->
  <g transform="translate(820, 215)">
    <!-- WordPress circle (muted) -->
    <g filter="url(#softShadow)">
      <circle cx="0" cy="100" r="70" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5" />
      <text x="0" y="118" text-anchor="middle" font-family="'72','Inter',sans-serif" font-weight="800" font-size="64" fill="#6a6d70">W</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(85, 92)">
      <line x1="0" y1="8" x2="80" y2="8" stroke="#0a6ed1" stroke-width="3" stroke-linecap="round" />
      <polygon points="80,8 66,0 66,16" fill="#0a6ed1" />
    </g>

    <!-- Hugo circle (highlighted in SAP blue) -->
    <g transform="translate(260, 0)" filter="url(#softShadow)">
      <circle cx="0" cy="100" r="90" fill="url(#sapBlue)" />
      <text x="0" y="125" text-anchor="middle" font-family="'72','Inter',sans-serif" font-weight="800" font-size="84" fill="#ffffff">H</text>
    </g>
  </g>
</svg>
