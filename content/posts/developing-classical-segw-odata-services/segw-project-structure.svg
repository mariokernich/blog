<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #0b0f19; border-radius: 12px; border: 1px solid #1e293b;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      .title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #3b82f6;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 400;
        font-size: 13px;
        fill: #64748b;
      }
      .panel-header {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .tree-node-main {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #f1f5f9;
      }
      .tree-node-folder {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 400;
        fill: #cbd5e1;
      }
      .tree-node-leaf {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .tree-node-artifact {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 400;
        fill: #fbbf24;
      }
      .tree-node-ok {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #10b981;
      }
      .grid-lines {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.3;
      }
      .icon-folder { fill: #eab308; }
      .icon-service { fill: #38bdf8; }
      .icon-entity { fill: #10b981; }
      .icon-assoc { fill: #f97316; }
      .icon-artifact { fill: #ec4899; }
      .pane { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Title block -->
  <g transform="translate(45, 40)">
    <text x="0" y="0" class="title">SAP SERVICE BUILDER (SEGW) RUNTIME INTERFACE</text>
    <text x="0" y="20" class="subtitle">Visual representation of the created project hierarchy in SEGW SAP Gateway Builder Workspace</text>
  </g>

  <!-- Left Pane: Project Builder Tree View -->
  <g transform="translate(45, 100)">
    <!-- Container -->
    <rect width="440" height="535" rx="8" class="pane" />
    <rect width="440" height="35" rx="8" fill="#1e293b" opacity="0.5" />
    <text x="15" y="22" class="panel-header">PROJECT BUILDER WORKSPACE</text>

    <!-- Project Tree Node -->
    <g transform="translate(15, 60)">
      <!-- Project Root -->
      <polygon points="12,18 20,24 12,30" fill="#94a3b8" />
      <rect x="25" y="10" width="16" height="16" rx="2" class="icon-service" />
      <text x="48" y="23" class="tree-node-main">ZSO_SALES_ORDER_SRV</text>

      <!-- Data Model -->
      <g transform="translate(20, 25)">
        <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
        <path d="M 25,18 L 38,18 L 38,24 L 25,24 Z" class="icon-folder" />
        <rect x="25" y="14" width="16" height="12" rx="1" class="icon-folder" />
        <text x="48" y="23" class="tree-node-folder">Data Model</text>

        <!-- Nested Data Model Leafs -->
        <g transform="translate(20, 22)">
          <!-- Entity Types -->
          <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
          <rect x="25" y="14" width="16" height="12" rx="1" class="icon-folder" />
          <text x="48" y="23" class="tree-node-folder">Entity Types</text>
          
          <g transform="translate(20, 22)">
            <!-- HandlingUnit Entity -->
            <polygon points="12,21 18,27 12,33" fill="#94a3b8" />
            <rect x="25" y="15" width="14" height="14" rx="2" class="icon-entity" />
            <text x="48" y="27" class="tree-node-leaf">HandlingUnit</text>
            
            <g transform="translate(20, 24)">
              <rect x="25" y="15" width="14" height="12" rx="1" class="icon-folder" />
              <text x="48" y="25" class="tree-node-leaf">Properties</text>
              <rect x="25" y="37" width="14" height="12" rx="1" class="icon-folder" />
              <text x="48" y="47" class="tree-node-leaf">Navigation Properties</text>
              <!-- ToItems Navigation -->
              <circle cx="53" cy="67" r="4" fill="#a855f7" />
              <text x="68" y="70" class="tree-node-leaf" fill="#a855f7">ToItems</text>
            </g>
          </g>

          <g transform="translate(20, 116)">
            <!-- HandlingUnitItem Entity -->
            <polygon points="12,19 12,27 18,23" fill="#94a3b8" />
            <rect x="25" y="13" width="14" height="14" rx="2" class="icon-entity" />
            <text x="48" y="25" class="tree-node-leaf">HandlingUnitItem</text>
          </g>

          <!-- Association -->
          <g transform="translate(0, 160)">
            <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
            <rect x="25" y="14" width="16" height="12" rx="1" class="icon-folder" />
            <text x="48" y="23" class="tree-node-folder">Associations</text>
            <!-- Assoc node -->
            <circle cx="52" cy="46" r="5" class="icon-assoc" />
            <text x="68" y="50" class="tree-node-leaf" fill="#f97316">Assoc_HU_To_Items</text>
          </g>

          <!-- Entity Sets -->
          <g transform="translate(0, 230)">
            <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
            <rect x="25" y="14" width="16" height="12" rx="1" class="icon-folder" />
            <text x="48" y="23" class="tree-node-folder">Entity Sets</text>
            <!-- HandlingUnits Set -->
            <rect x="45" y="38" width="14" height="14" rx="2" fill="#cbd5e1" />
            <text x="68" y="50" class="tree-node-leaf">HandlingUnits</text>
            <!-- HandlingUnitItems Set -->
            <rect x="45" y="60" width="14" height="14" rx="2" fill="#cbd5e1" />
            <text x="68" y="72" class="tree-node-leaf">HandlingUnitItems</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Pane: Service Implementation & Runtime Artifacts -->
  <g transform="translate(515, 100)">
    <!-- Container -->
    <rect width="440" height="535" rx="8" class="pane" />
    <rect width="440" height="35" rx="8" fill="#1e293b" opacity="0.5" />
    <text x="15" y="22" class="panel-header">SERVICE IMPLEMENTATION &amp; ARTIFACTS</text>

    <!-- Service Implementation Node -->
    <g transform="translate(15, 60)">
      <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
      <rect x="25" y="14" width="16" height="12" rx="1" class="icon-folder" />
      <text x="48" y="23" class="tree-node-folder">Service Implementation</text>

      <g transform="translate(20, 22)">
        <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
        <rect x="25" y="14" width="16" height="12" rx="1" fill="#ec4899" />
        <text x="48" y="23" class="tree-node-folder">HandlingUnits (OData Operations)</text>

        <!-- Operation Leafs -->
        <g transform="translate(20, 24)">
          <!-- Create -->
          <rect x="25" y="10" width="12" height="12" rx="2" fill="#10b981" />
          <text x="45" y="20" class="tree-node-leaf">Create =&gt; <tspan class="tree-node-ok">Implemented (DPC_EXT)</tspan></text>
          <!-- Delete -->
          <rect x="25" y="28" width="12" height="12" rx="2" fill="#ef4444" />
          <text x="45" y="38" class="tree-node-leaf">Delete =&gt; <tspan class="tree-node-ok">Implemented (DPC_EXT)</tspan></text>
          <!-- Read -->
          <rect x="25" y="46" width="12" height="12" rx="2" fill="#3b82f6" />
          <text x="45" y="56" class="tree-node-leaf">Read   =&gt; <tspan class="tree-node-ok">Implemented (DPC_EXT)</tspan></text>
          <!-- Query -->
          <rect x="25" y="64" width="12" height="12" rx="2" fill="#eab308" />
          <text x="45" y="74" class="tree-node-leaf">Query  =&gt; <tspan class="tree-node-ok">Implemented (DPC_EXT)</tspan></text>
          <!-- Update -->
          <rect x="25" y="82" width="12" height="12" rx="2" fill="#a855f7" />
          <text x="45" y="92" class="tree-node-leaf">Update =&gt; <tspan class="tree-node-ok">Implemented (DPC_EXT)</tspan></text>
        </g>
      </g>
    </g>

    <!-- Runtime Artifacts Node -->
    <g transform="translate(15, 230)">
      <polygon points="12,21 18,27 12,33" fill="#ffffff" transform="rotate(45 15 27)" />
      <rect x="25" y="14" width="16" height="12" rx="1" fill="#a855f7" stroke="#c084fc" stroke-width="1.5" />
      <text x="48" y="24" class="tree-node-folder" fill="#c084fc">Runtime Artifacts</text>

      <g transform="translate(20, 24)">
        <!-- MPC Base -->
        <rect x="25" y="10" width="14" height="14" rx="2" class="icon-artifact" />
        <text x="48" y="22" class="tree-node-artifact" fill="#64748b">ZCL_ZEWM_HANDLING_UNIT_MPC (Generated, do not touch)</text>

        <!-- MPC EXT -->
        <rect x="25" y="32" width="14" height="14" rx="2" class="icon-artifact" />
        <text x="48" y="44" class="tree-node-artifact">ZCL_ZEWM_HANDLING_UNIT_MPC_EXT (Custom types, manual)</text>

        <!-- DPC Base -->
        <rect x="25" y="54" width="14" height="14" rx="2" class="icon-artifact" />
        <text x="48" y="66" class="tree-node-artifact" fill="#64748b">ZCL_ZEWM_HANDLING_UNIT_DPC (Generated, do not touch)</text>

        <!-- DPC EXT -->
        <rect x="25" y="76" width="14" height="14" rx="2" class="icon-artifact" />
        <text x="48" y="88" class="tree-node-artifact" fill="#38bdf8" style="font-weight: bold;">ZCL_ZEWM_HANDLING_UNIT_DPC_EXT (Core business code!)</text>

        <path d="M 150,98 L 150,140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
        <rect x="48" y="146" width="320" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="60" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#38bdf8">CORE WORKSPACE FOR ABAP DEVELOPER</text>
        <text x="60" y="186" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Redefine methods like:</text>
        <text x="60" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">/IWBEP/IF_MGW_APPL_SRV_RUNTIME~*</text>
      </g>
    </g>
  </g>
</svg>