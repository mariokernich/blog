<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; border: 1px solid #1e293b;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      .title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #38bdf8;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 400;
        font-size: 13px;
        fill: #64748b;
      }
      .entity-header {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #ffffff;
      }
      .entity-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        fill: #94a3b8;
      }
      .entity-key {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #38bdf8;
      }
      .association-txt {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #eab308;
      }
      .nav-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        fill: #a855f7;
      }
      .grid-lines {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.5;
      }
      .connector {
        stroke: #eab308;
        stroke-width: 2;
        stroke-dasharray: 4 4;
        fill: none;
      }
      .arrow {
        fill: #eab308;
      }
    </style>
    <!-- Shadow Filter -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Draw.io Grid Background -->
  <g>
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="1000" y2="50" class="grid-lines" />
    <line x1="0" y1="100" x2="1000" y2="100" class="grid-lines" />
    <line x1="0" y1="150" x2="1000" y2="150" class="grid-lines" />
    <line x1="0" y1="200" x2="1000" y2="200" class="grid-lines" />
    <line x1="0" y1="250" x2="1000" y2="250" class="grid-lines" />
    <line x1="0" y1="300" x2="1000" y2="300" class="grid-lines" />
    <line x1="0" y1="350" x2="1000" y2="350" class="grid-lines" />
    <line x1="0" y1="400" x2="1000" y2="400" class="grid-lines" />
    
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="450" class="grid-lines" />
    <line x1="200" y1="0" x2="200" y2="450" class="grid-lines" />
    <line x1="300" y1="0" x2="300" y2="450" class="grid-lines" />
    <line x1="400" y1="0" x2="400" y2="450" class="grid-lines" />
    <line x1="500" y1="0" x2="500" y2="450" class="grid-lines" />
    <line x1="600" y1="0" x2="600" y2="450" class="grid-lines" />
    <line x1="700" y1="0" x2="700" y2="450" class="grid-lines" />
    <line x1="800" y1="0" x2="800" y2="450" class="grid-lines" />
    <line x1="900" y1="0" x2="900" y2="450" class="grid-lines" />
  </g>

  <!-- Title block -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" class="title">CONCEPTUAL ENTITY BLUEPRINT (DRAWiO)</text>
    <text x="0" y="20" class="subtitle">Designed blueprint before generating SEGW Gateway configurations</text>
  </g>

  <!-- Entity 1: HandlingUnit (Header) -->
  <g transform="translate(100, 110)" filter="url(#boxShadow)">
    <!-- Header Block -->
    <rect width="280" height="42" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <!-- Content Body -->
    <rect y="42" width="280" height="198" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Visual Divider -->
    <line x1="0" y1="42" x2="280" y2="42" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="0" y1="120" x2="280" y2="120" stroke="#334155" stroke-dasharray="2 2" />

    <!-- Typography -->
    <text x="140" y="26" class="entity-header" text-anchor="middle">Entity: HandlingUnit</text>
    
    <!-- Keys Section -->
    <text x="20" y="66" class="entity-key">[Key] HandlingUnitID : String(20)</text>
    <text x="20" y="86" class="entity-txt">      WarehouseNo  : String(4)</text>
    
    <!-- Properties Section -->
    <text x="20" y="142" class="entity-txt">StorageBin      : String(18)</text>
    <text x="20" y="162" class="entity-txt">GrossWeight     : Decimal(15,3)</text>
    <text x="20" y="182" class="entity-txt">WeightUnit      : String(3)</text>
    <text x="20" y="202" class="entity-txt">Status          : String(4)</text>
    <text x="20" y="222" class="entity-txt">CreatedAt       : DateTime</text>

    <!-- Navigation Property block at bottom -->
    <rect y="240" width="280" height="34" rx="4" fill="#6b21a8" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
    <text x="15" y="261" class="nav-txt">Navigation: ToItems =&gt; 0..*</text>
  </g>

  <!-- Connecting Association Line (1 to many) -->
  <g>
    <!-- Path connecting two entities -->
    <path d="M 380,240 L 460,240 L 460,240 L 620,240" class="connector" />
    <!-- Arrows on the ends -->
    <circle cx="380" cy="240" r="4" fill="#eab308" />
    
    <!-- Crow's foot style or simple arrow for "many" side -->
    <path d="M 610,235 L 610,245 L 622,240 Z" class="arrow" />

    <rect x="420" y="175" width="160" height="50" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <text x="500" y="195" class="association-txt" text-anchor="middle">Association (1 : N)</text>
    <text x="500" y="213" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Assoc_HU_To_Items</text>
  </g>

  <!-- Entity 2: HandlingUnitItem (Items) -->
  <g transform="translate(620, 110)" filter="url(#boxShadow)">
    <!-- Header Block -->
    <rect width="280" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <!-- Content Body -->
    <rect y="42" width="280" height="198" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Visual Divider -->
    <line x1="0" y1="42" x2="280" y2="42" stroke="#10b981" stroke-width="1.5" />
    <line x1="0" y1="120" x2="280" y2="120" stroke="#334155" stroke-dasharray="2 2" />

    <!-- Typography -->
    <text x="140" y="26" class="entity-header" text-anchor="middle">Entity: HandlingUnitItem</text>
    
    <!-- Keys Section -->
    <text x="20" y="66" class="entity-key">[Key] HandlingUnitID : String(20)</text>
    <text x="20" y="86" class="entity-key">[Key] ItemPosition   : Integer</text>
    
    <!-- Properties Section -->
    <text x="20" y="142" class="entity-txt">MaterialID      : String(18)</text>
    <text x="20" y="162" class="entity-txt">Quantity        : Decimal(13,3)</text>
    <text x="20" y="182" class="entity-txt">Unit            : String(3)</text>
    <text x="20" y="202" class="entity-txt">GrossVolume     : Decimal(15,3)</text>
    <text x="20" y="222" class="entity-txt">VolumeUnit      : String(3)</text>

    <!-- Inverse Navigation (optional link back) -->
    <rect y="240" width="280" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="15" y="261" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Navigation: ToHeader =&gt; 1</text>
  </g>
</svg>