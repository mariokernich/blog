baseURL: "https://example.org/"
locale: "de-de"
title: "Mein Blog"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Mein Blog"
  description: "Ein neuer Hugo-Blog mit PaperMod"
  keywords: [Blog, Hugo, PaperMod]
  author: "Mario"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  comments: false

  homeInfoParams:
    Title: "Willkommen 👋"
    Content: "Das ist mein neuer Blog mit Hugo und PaperMod."

  socialIcons:
    - name: github
      url: "https://github.com/"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: posts
      name: Beiträge
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archiv
      url: /archives/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Suche
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
