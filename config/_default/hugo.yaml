baseURL: "https://blog.kernich.de/"
locale: "en-us"
title: "Mario Kernich Blog"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Mario Kernich Blog"
  description: "A new Hugo blog with PaperMod"
  keywords: [Blog, Hugo, PaperMod]
  author: "Mario Kernich"
  defaultTheme: auto
  mainSections:
    - posts
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  comments: false

  footer:
    text: "[Imprint](/imprint/)"

  homeInfoParams:
    Title: "Welcome 👋"
    Content: "This is my new blog built with Hugo and PaperMod."

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/mariokernich"
    - name: github
      url: "https://github.com/mariokernich"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: rss
      name: RSS
      url: /index.xml
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
