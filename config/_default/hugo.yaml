baseURL: "https://blog.kernich.de/"
locale: "en-us"
title: "Mario Kernich Blog"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Mario Kernich Blog"
  description: "Tutorials, guides, and news about ABAP, UI5, RAP, Cloud, and AI by Mario Kernich."
  keywords: [Blog, Hugo, PaperMod]
  author: "Mario Kernich"
  hideAuthor: true
  defaultTheme: auto
  label:
    icon: "images/kernich-logo.svg"
    iconHeight: 25
    text: " "
  mainSections:
    - posts
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  comments: false

  assets:
    favicon: "favicon.ico?v=2"
    favicon16x16: "favicon-16x16.png?v=2"
    favicon32x32: "favicon-32x32.png?v=2"
    apple_touch_icon: "apple-touch-icon.png?v=2"

  cover:
    linkFullImages: true
    responsiveImages: true
    hiddenInSingle: true

  footer:
    text: "[Imprint](/imprint/)"

  homeInfoParams:
    Title: "Welcome 👋"
    Content: "I'm a Technology Manager with a passion for continuously exploring modern tech. Here, you'll find guides, tutorials, and latest news on ABAP, UI5, RAP, Cloud computing, and AI — as well as some off-topic insights from my personal life or other programming languages."

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/mariokernich"
    - name: github
      url: "https://github.com/mariokernich"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 15
    - identifier: talks
      name: Talks
      url: /talks/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 25
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: rss
      name: RSS
      url: /index.xml
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
  goldmark:
    renderer:
      unsafe: true
