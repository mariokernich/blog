name: Deploy via FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between in-progress
# runs and the latest queued one.
concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.162.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # required for the PaperMod theme submodule
          fetch-depth: 0          # full history (used by .GitInfo / .Lastmod)

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify

      # FTP-Deploy-Action requires server-dir to end with "/".
      - name: Normalize server dir
        id: ftp
        env:
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: echo "dir=${FTP_PATH%/}/" >> "$GITHUB_OUTPUT"

      - name: Deploy to kernich.de via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./public/
          server-dir: ${{ steps.ftp.outputs.dir }}
          dangerous-clean-slate: false
          log-level: standard
